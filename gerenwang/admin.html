<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>内容管理 · 沉浸视界</title>
<style>
  :root { --bg:#0c0818; --card:#191228; --line:rgba(255,222,196,.16); --txt:#f6eef7; --dim:rgba(246,238,247,.55); --accent:#ffd28a; --ok:#7dffb0; --err:#ff9e8a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "PingFang SC","Microsoft YaHei",system-ui,sans-serif; background: radial-gradient(120% 100% at 50% 0%, #1c1230, var(--bg) 60%); color: var(--txt); min-height: 100vh; padding-bottom: 90px; }
  .top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px; padding: 14px 20px; background: rgba(12,8,24,.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .top h1 { font-size: 18px; flex: 1; }
  .top .note { font-size: 12px; color: var(--dim); }
  button { font: inherit; color: var(--txt); border: 1px solid var(--line); background: rgba(255,255,255,.06); border-radius: 10px; padding: 8px 16px; cursor: pointer; transition: .2s; }
  button:hover { background: rgba(255,255,255,.14); }
  button.primary { background: linear-gradient(120deg, rgba(255,190,120,.9), rgba(255,140,175,.75)); border: none; font-weight: 700; }
  #status { position: fixed; right: 18px; bottom: 18px; z-index: 99; padding: 10px 18px; border-radius: 12px; background: rgba(20,14,36,.95); border: 1px solid var(--line); font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .3s; }
  #status.show { opacity: 1; }
  #status.ok { border-color: var(--ok); color: var(--ok); }
  #status.err { border-color: var(--err); color: var(--err); }
  main { max-width: 900px; margin: 24px auto; padding: 0 18px; display: grid; gap: 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
  .card h2 { font-size: 16px; margin-bottom: 4px; }
  .card .hint { font-size: 12px; color: var(--dim); margin-bottom: 14px; }
  .row { display: grid; gap: 8px; padding: 12px 0; border-top: 1px dashed rgba(255,222,196,.1); }
  .row:first-of-type { border-top: none; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 4px; }
  input, textarea, select { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255,222,196,.2); background: rgba(255,255,255,.05); color: var(--txt); font: inherit; font-size: 13px; outline: none; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 52px; }
  .rowhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .rowhead b { font-size: 13px; color: var(--accent); }
  .del { color: var(--err); font-size: 12px; padding: 4px 10px; }
  .addbtn { margin-top: 10px; font-size: 13px; }
  .up { font-size: 12px; padding: 5px 10px; margin-top: 4px; }
  .small { font-size: 12px; color: var(--dim); }
  .hide { display: none; }
  .cover-preview { max-width: 120px; border-radius: 8px; margin-top: 6px; }
  #login { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(8,5,16,.6); backdrop-filter: blur(6px); }
  #login.hide, .hide { display: none; }
  .lcard { width: min(400px, 92vw); background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 26px 26px 22px; box-shadow: 0 24px 80px rgba(0,0,0,.5); }
  .lcard h2 { margin-bottom: 6px; }
  .lcard .small { margin-bottom: 14px; }
  .lcard input { margin-bottom: 10px; }
  .lerr { color: var(--err); font-size: 13px; margin: 4px 0 10px; }
  .lbtns { display: flex; gap: 10px; margin-top: 4px; }
  .lbtns button { flex: 1; }
  button.ghost { background: transparent; }
</style>
</head>
<body>
  <header class="top">
    <h1>✨ 沉浸视界 · 内容管理</h1>
    <span class="note">改完点「保存」→ 回网站刷新即可看到</span>
    <button id="btn-preview">👀 预览网站</button>
    <button id="btn-save" class="primary">💾 保存全部</button>
  </header>
  <div id="status"></div>

  <!-- 登录页 -->
  <div id="login" class="hide">
    <div class="lcard">
      <h2>🔐 管理登录</h2>
      <p class="small">内容管理需要口令验证。登录后即可编辑并保存。</p>
      <input id="pass" type="password" placeholder="管理口令" autocomplete="current-password" />
      <p id="login-err" class="lerr hide"></p>
      <div class="lbtns">
        <button id="btn-login" class="primary">登录</button>
        <button id="btn-local" class="ghost">🖥 本机免密进入</button>
      </div>
    </div>
  </div>

  <main id="main"><p class="note">正在加载…</p></main>
  <script src="./admin.js"></script>
</body>
</html>
